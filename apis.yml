aid: abtis2772
name: AbTis
description: >-
  AbTis Co., Ltd. (앱티스) is a South Korean biotechnology company founded in 2016 and headquartered in
  Yongin-si, Gyeonggi-do, inside the Dong-A Socio Holdings R&D Center. It develops AbClick, a
  third-generation site-selective antibody conjugation platform that attaches payloads to the Fc
  Lys248 residue of native IgG antibodies with no enzyme and no Fc engineering, giving a controlled
  drug-to-antibody ratio and batch-to-batch consistency across ADC, DAC, AOC, ARC, ISAC and
  dual-payload designs. AbTis licenses the platform, runs collaborative research and fee-for-service
  ADC development, and advances its own pipeline led by AT-211, a Claudin 18.2-targeting MMAE ADC.
  Acquired by Dong-A ST in 2023, it now operates as that company's ADC-specialised subsidiary. Its
  product is licensed chemistry and drug intellectual property, not software: it runs no developer
  program, public API, SDK or machine-readable contract.
